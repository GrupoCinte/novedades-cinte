services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: novedades_cinte
      POSTGRES_USER: cinte_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U cinte_app -d novedades_cinte"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

